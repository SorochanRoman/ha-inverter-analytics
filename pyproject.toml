[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Logs from dependencies (sqlalchemy, homeassistant.recorder) are silenced by a
# hook in tests/conftest.py. log_cli = false is set explicitly here to keep them
# from leaking through if that setting is ever overridden globally.
log_cli = false

[tool.ruff]
target-version = "py312"
line-length = 100
# ruff format reformats Python code blocks inside Markdown. The plans and
# specs under docs/ are the verbatim source of briefs for future tasks,
# so the formatter must not touch them. This applies to format, not check.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
