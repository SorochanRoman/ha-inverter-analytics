name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Validates the integration manifest — a property of the code, so we run it on everything.
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  # HACS checks the repository's own metadata — license, description, topics —
  # and GitHub only serves that from the default branch. On a branch these
  # checks measure nothing: GitHub won't see a license added on the branch
  # until it's merged into main, so a red result there is inevitable and
  # uninformative.
  hacs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # brands requires an icon in the home-assistant/brands repository. This
          # is a requirement for listing in the default HACS catalog, not for
          # installing via Custom repositories. Remove once we submit an icon to brands.
          ignore: brands

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # The bundle is committed, because HACS installs straight from the
      # repository. A source change without a rebuild would ship the old panel.
      - name: Check that the committed bundle matches the source
        run: git diff --exit-code -- ../custom_components/inverter_analytics/frontend/dist
